apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gnone-api-hpa
  namespace: gnone
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gnone-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: gnone_pipeline_latency_seconds
        target:
          type: AverageValue
          averageValue: 10
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
