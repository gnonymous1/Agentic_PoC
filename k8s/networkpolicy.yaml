apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gnone-default-deny-ingress
  namespace: gnone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gnone-allow-api-to-postgres
  namespace: gnone
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gnone-api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gnone-allow-api-to-redis
  namespace: gnone
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gnone-api
      ports:
        - port: 6379
