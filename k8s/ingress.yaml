apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gnone-ingress
  namespace: gnone
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
spec:
  tls:
    - hosts:
        - api.gnone.ai
      secretName: gnone-tls
  rules:
    - host: api.gnone.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gnone-api
                port:
                  number: 80
