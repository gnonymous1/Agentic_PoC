apiVersion: batch/v1
kind: Job
metadata:
  name: gnone-migrate
  namespace: gnone
  annotations:
    description: "One-shot database migration job for GNONE."
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/gnone/gnone-api:latest
          command:
            - /app/migrate.sh
          envFrom:
            - secretRef:
                name: gnone-secrets
      restartPolicy: Never
  backoffLimit: 3
